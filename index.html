<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ごみ箱マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<style>
:root{--bg:#f6f7f5;--ink:#1d2421;--sub:#5d6862;--line:#d9dedb;--card:#fff;--accent:#1f7a5c}
@media (prefers-color-scheme:dark){:root{--bg:#161b19;--ink:#eef2ef;--sub:#a3aea8;--line:#2d3632;--card:#1f2623;--accent:#4cc79b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{padding:10px 12px 8px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:16px;margin:0 0 8px}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.4}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{flex:1;min-height:0}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.none{border-radius:4px;transform:none}
#bar{padding:8px 12px;background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub)}
#bar span{flex:1}
button.main{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer}
button.sub{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:14px;z-index:1000;display:none;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
#sheet h2{font-size:15px;margin:0 0 10px}
#sheet select,#sheet input{width:100%;padding:10px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
#sheet .row{display:flex;gap:8px}
.leaflet-popup-content{font-size:13px;line-height:1.5}
.leaflet-popup-content .acts{display:flex;gap:6px;margin-top:8px}
.tag{font-size:11px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>ごみ箱マップ</h1>
  <div id="chips" role="group" aria-label="種類で絞り込み"></div>
</header>
<div id="map"></div>
<div id="bar">
  <span id="count"></span>
  <button class="main" id="add">現在地に追加</button>
</div>
<div id="sheet">
  <h2 id="sheetTitle">ごみ箱を追加</h2>
  <select id="type" aria-label="種類"></select>
  <input id="note" maxlength="100" placeholder="メモ（例：北口改札内、自販機の横）" aria-label="メモ">
  <div class="row"><button class="sub" id="cancel" style="flex:1">やめる</button><button class="main" id="save" style="flex:2">追加する</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
// ===== 設定：Supabase を作ったらここに2つ貼る（空のままなら端末内だけで動く試用モード） =====
var SUPABASE_URL = "https://xaiupxadvwldlrikdypj.supabase.co";
var SUPABASE_KEY = "sb_publishable_Y4ZFLf1izOOdNp3szHmVjA_RFaZ92_Z";   // publishable key（公開してよい）

var TYPES = {
  pet:   {name:"ペットボトル", color:"#2b7bd6"},
  can:   {name:"缶",           color:"#d97b1c"},
  sort:  {name:"分別",         color:"#1f9d6b"},
  burn:  {name:"燃えるごみ",   color:"#7a6a5c"},
  none:  {name:"ごみ箱なし",   color:"#d63b3b"},
  sb:    {name:"スタバ",       color:"#00704a"},
  tully: {name:"タリーズ",     color:"#8c2a2a"},
  gong:  {name:"ごんちゃ",     color:"#c9a227"}
};
var HIDE_AT = 3; // 間違い報告がこの数に達したピンは非表示

var ONLINE = !!(SUPABASE_URL && SUPABASE_KEY);
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){} return null; }
var TOKEN = ls("gomi-token") || (self.crypto&&crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)+Date.now());
ls("gomi-token", TOKEN);
var mine = {}; try{ mine = JSON.parse(ls("gomi-mine")||"{}"); }catch(e){}
var reported = {}; try{ reported = JSON.parse(ls("gomi-reported")||"{}"); }catch(e){}

// ===== データ層 =====
var pins = [];
function api(path, opt){
  opt = opt||{};
  var h = {apikey:SUPABASE_KEY, "Content-Type":"application/json"};
  if(SUPABASE_KEY.indexOf("eyJ")===0) h.Authorization = "Bearer "+SUPABASE_KEY; // 旧形式(JWT)のキーのときだけ必要
  opt.headers = Object.assign(h, opt.headers||{});
  return fetch(SUPABASE_URL+"/rest/v1/"+path, opt).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.status===204 ? null : r.json();
  });
}
function loadPins(){
  if(ONLINE){
    return api("pins_public?select=id,t,lat,lng,note,reports&reports=lt."+HIDE_AT+"&order=id.desc&limit=5000")
      .then(function(rows){ pins=rows; render(); })
      .catch(function(){ document.getElementById("count").textContent="読み込みに失敗しました"; });
  }
  try{ pins = JSON.parse(ls("gomi-local")||"[]"); }catch(e){ pins=[]; }
  render(); return Promise.resolve();
}
function addPin(p){
  if(ONLINE){
    return api("rpc/add_pin",{method:"POST",body:JSON.stringify({p_t:p.t,p_lat:p.lat,p_lng:p.lng,p_note:p.note,tok:TOKEN})})
      .then(function(id){ mine[id]=1; ls("gomi-mine",JSON.stringify(mine)); return loadPins(); });
  }
  p.id = Date.now(); mine[p.id]=1; ls("gomi-mine",JSON.stringify(mine));
  pins.push(p); ls("gomi-local",JSON.stringify(pins)); render(); return Promise.resolve();
}
function delPin(p){
  if(ONLINE){
    return api("rpc/delete_own",{method:"POST",body:JSON.stringify({pin_id:p.id,tok:TOKEN})}).then(loadPins);
  }
  pins = pins.filter(function(x){return x.id!==p.id;}); ls("gomi-local",JSON.stringify(pins)); render(); return Promise.resolve();
}
function reportPin(p){
  reported[p.id]=1; ls("gomi-reported",JSON.stringify(reported));
  if(ONLINE) return api("rpc/report_pin",{method:"POST",body:JSON.stringify({pin_id:p.id})});
  return Promise.resolve();
}

// ===== 地図 =====
var map = L.map("map").setView([36.2,138.0],5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19, attribution:"© OpenStreetMap contributors"}).addTo(map);
var cluster = L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:50});
map.addLayer(cluster);
var active = {}; Object.keys(TYPES).forEach(function(k){ active[k]=true; });

function icon(t){
  return L.divIcon({className:"", iconSize:[22,22], iconAnchor:[11,22], popupAnchor:[0,-20],
    html:'<div class="pin'+(t==="none"?" none":"")+'" style="background:'+TYPES[t].color+'"></div>'});
}
function esc(s){ return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function render(){
  cluster.clearLayers();
  var n=0;
  pins.forEach(function(p){
    if(!active[p.t] || !TYPES[p.t]) return;
    n++;
    var box=document.createElement("div");
    box.innerHTML="<b>"+esc(TYPES[p.t].name)+"</b><br>"+esc(p.note);
    var acts=document.createElement("div"); acts.className="acts";
    if(mine[p.id]){
      var d=document.createElement("button"); d.className="sub"; d.textContent="削除";
      d.onclick=function(){ delPin(p); }; acts.appendChild(d);
    } else {
      var r=document.createElement("button"); r.className="sub";
      r.textContent = reported[p.id] ? "報告済み" : "間違いを報告";
      r.disabled = !!reported[p.id];
      r.onclick=function(){ reportPin(p); r.textContent="報告しました"; r.disabled=true; };
      acts.appendChild(r);
    }
    box.appendChild(acts);
    cluster.addLayer(L.marker([p.lat,p.lng],{icon:icon(p.t)}).bindPopup(box));
  });
  document.getElementById("count").textContent = n+"件を表示中";
}

// 絞り込みチップと種類選択
var chips = document.getElementById("chips"), sel = document.getElementById("type");
Object.keys(TYPES).forEach(function(k){
  var b = document.createElement("button");
  b.className="chip"; b.type="button";
  b.innerHTML='<i style="background:'+TYPES[k].color+'"></i>'+TYPES[k].name;
  b.onclick=function(){ active[k]=!active[k]; b.classList.toggle("off",!active[k]); render(); };
  chips.appendChild(b);
  var o=document.createElement("option"); o.value=k; o.textContent=TYPES[k].name; sel.appendChild(o);
});

// 現在地
var me=null, myPos=null, first=true;
map.on("locationfound",function(e){
  myPos=e.latlng;
  if(me){ me.setLatLng(e.latlng); }
  else { me=L.circleMarker(e.latlng,{radius:8,color:"#fff",weight:3,fillColor:"#2b7bd6",fillOpacity:1}).addTo(map); }
});
map.locate({setView:true, maxZoom:16, watch:true, enableHighAccuracy:true});
map.on("locationfound",function(){ if(first){ first=false; map.stopLocate(); map.locate({watch:true,enableHighAccuracy:true}); } });

// 追加：現在地が取れていれば現在地、無ければ地図の中心
var sheet=document.getElementById("sheet");
document.getElementById("add").onclick=function(){
  document.getElementById("sheetTitle").textContent = myPos ? "現在地にごみ箱を追加" : "地図の中心にごみ箱を追加";
  sheet.style.display="block";
};
document.getElementById("cancel").onclick=function(){ sheet.style.display="none"; };
document.getElementById("save").onclick=function(){
  var c = myPos || map.getCenter(), btn=this;
  btn.disabled=true;
  addPin({t:sel.value, lat:+c.lat.toFixed(6), lng:+c.lng.toFixed(6), note:document.getElementById("note").value})
    .then(function(){ document.getElementById("note").value=""; sheet.style.display="none"; })
    .catch(function(){ alert("追加に失敗しました。通信状況を確認してください。"); })
    .then(function(){ btn.disabled=false; });
};
map.on("click",function(){ sheet.style.display="none"; });

loadPins();
</script>
</body>
</html>
